name: Swift and iOS checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test core in Swift 6 mode
        run: swift test
      - name: Build iOS app
        run: xcodebuild -project Folio.xcodeproj -scheme Folio -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
      - name: Test SwiftData persistence and review flow
        shell: bash
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone") and d.get("isAvailable")))')
          xcodebuild -project Folio.xcodeproj -scheme Folio -destination "platform=iOS Simulator,id=$SIMULATOR_ID" test CODE_SIGNING_ALLOWED=NO
